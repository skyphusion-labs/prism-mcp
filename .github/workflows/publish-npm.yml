name: Publish npm package

# Publish: cut a GitHub Release from an existing prism-mcp-v* tag.
# Or: workflow_dispatch (uses version in package.json).
# A tag push alone deploys the Worker (deploy.yml) and does not publish.
#
# Required repo secret: NPM_TOKEN

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish @skyphusion/prism-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assert commit is on main (no publish of an unreviewed release)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main; refusing to publish an unreviewed release"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        # Route the (maintainer-controlled but still untrusted) tag through env
        # rather than interpolating it into the script body, so a tag containing
        # shell metacharacters ($ ( ) backticks) cannot inject into the run step.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          tag="${tag#prism-mcp-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag prism-mcp-v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - name: Publish to npm
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "${pkg}@${ver}" version >/dev/null 2>&1; then
            echo "Skip: ${pkg}@${ver} already published"
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
